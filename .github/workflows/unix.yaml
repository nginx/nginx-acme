name: Unix

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: 'always'
  RUST_BACKTRACE: '1'
  AWSLC_SOURCE_DIR: ${{ github.workspace }}/aws-lc
  BORINGSSL_SOURCE_DIR: ${{ github.workspace }}/boringssl
  OPENSSL_SOURCE_DIR: ${{ github.workspace }}/openssl
  NGINX_SOURCE_DIR: nginx

jobs:
  rust-version:
    name: Minimal supported Rust version
    outputs:
      version: ${{ steps.read_version.outputs.msrv }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read_version
        run: |
          awk -F '=' \
            '/^rust-version[[:space:]]*=/ { gsub(/([" ]|#.*)/,"",$2); print ("msrv=" $2) }' \
            Cargo.toml \
          | tee -a "$GITHUB_OUTPUT"

  test:
    needs: rust-version

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        rust-version:
          - stable
        nginx-ref:
          - master
          - stable-1.30
        build:
          - debug
          - debug-static
          - release
          - aws-lc
          - aws-lc-static
          - boringssl
          - boringssl-static

        include:
          # minimal supported nginx version
          - runner: ubuntu-latest
            rust-version: stable
            nginx-ref: stable-1.22
            build: debug

          # minimal supported Rust version
          - runner: ubuntu-latest
            rust-version: ${{ needs.rust-version.outputs.version }}
            nginx-ref: stable-1.30
            build: debug

          # minimal supported OpenSSL version
          - runner: ubuntu-latest
            rust-version: stable
            nginx-ref: stable-1.30
            openssl-ref: OpenSSL_1_1_1w
            build: openssl

          - runner: ubuntu-latest
            rust-version: stable
            nginx-ref: stable-1.30
            openssl-ref: OpenSSL_1_1_1w
            build: openssl-static

          # latest supported OpenSSL version
          - runner: ubuntu-latest
            rust-version: stable
            nginx-ref: stable-1.30
            openssl-ref: openssl-4.0
            build: openssl

          - runner: ubuntu-latest
            rust-version: stable
            nginx-ref: stable-1.30
            openssl-ref: openssl-4.0
            build: openssl-static

          # macOS
          - runner: macos-latest
            rust-version: stable
            nginx-ref: stable-1.30
            build: debug

    env:
      NGINX_EXTRA_CONFIGURE_ARGS: >-
        ${{ matrix.nginx-ref != 'stable-1.22' && '--with-http_v3_module' || '' }}
      testTarget: >-
        ${{ (matrix.nginx-ref == 'stable-1.30' && matrix.build == 'debug')
          && 'full-test'
          || 'test'
        }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.nginx-ref }}
          repository: 'nginx/nginx'
          path: 'nginx'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'nginx/nginx-tests'
          path: 'nginx/tests'

      - uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        id: aws-lc-latest
        if: startsWith(matrix.build, 'aws-lc')
        with:
          repository: 'aws/aws-lc'

      - uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        id: boringssl-latest
        if: startsWith(matrix.build, 'boringssl')
        with:
          repository: 'google/boringssl'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(matrix.build, 'aws-lc')
        with:
          ref: ${{ steps.aws-lc-latest.outputs.tag }}
          repository: 'aws/aws-lc'
          path: ${{ env.AWSLC_SOURCE_DIR }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(matrix.build, 'boringssl')
        with:
          ref: ${{ steps.boringssl-latest.outputs.tag }}
          repository: 'google/boringssl'
          path: ${{ env.BORINGSSL_SOURCE_DIR }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(matrix.build, 'openssl')
        with:
          ref: ${{ matrix.openssl-ref }}
          repository: 'openssl/openssl'
          path: ${{ env.OPENSSL_SOURCE_DIR }}

      - uses: perl-actions/install-with-cpm@b7eeb5ea204d9c9bd434e01162ae97629cf7fa36 # v2.4
        with:
          install: |
            IO::Socket::INET6
            IO::Socket::SSL

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bin/pebble
            objs-*/**/CACHEDIR.TAG
            objs-*/**/ngx-debug
            objs-*/**/ngx-release
            target/
          key: ${{ runner.os }}-nginx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-nginx-

      - name: set up Rust toolchain
        env:
          toolchain: ${{ matrix.rust-version }}
        run: |
          rustup toolchain install --no-self-update --override --profile minimal \
            --component 'rustfmt,clippy' $toolchain

      - name: download pebble
        run: |
          TEST_NGINX_PEBBLE_BINARY=$(perl build/get-pebble.pl)
          echo TEST_NGINX_PEBBLE_BINARY="$TEST_NGINX_PEBBLE_BINARY" >> "$GITHUB_ENV"

      - name: CPU count
        run: echo PARALLEL="-j $(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      - name: build
        id: build
        run: make BUILD=${{ matrix.build }} $PARALLEL build

      - name: check
        # always run if build succeeds
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make BUILD=${{ matrix.build }} check

      - name: run tests
        # always run if build succeeds
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make BUILD=${{ matrix.build }} TEST_PREREQ= ${{ env.testTarget }}

      - name: run unittests
        # unittests cannot link with Rust >= 1.89, so we limit execution to MSRV
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success' &&
              matrix.rust-version == needs.rust-version.outputs.version
          }}
        run: make BUILD=${{ matrix.build }} $PARALLEL unittest
